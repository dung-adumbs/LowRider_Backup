# LowRider V4 board-independent motion and host settings.

[printer]
kinematics: cartesian
max_velocity: 650
max_accel: 750
max_z_velocity: 100
max_z_accel: 337.5
square_corner_velocity: 1

[gcode_arcs]
resolution: 0.5

[idle_timeout]
timeout: 10800
gcode:
    # Motor shutdown is managed by leds.cfg, including paused-job protection.
    # Do not leave the default M84 here: it would bypass the UI Disabled setting.
    TURN_OFF_HEATERS

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 90
