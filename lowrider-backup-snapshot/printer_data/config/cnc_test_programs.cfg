# Runtime checks for the two LowRider commissioning files.
# These macros validate only; they never home, reset work zeros, or move.
[sdcard_loop]

[gcode_macro CNC_TEST_PREFLIGHT]
description: Check homing, work-coordinate bounds and pause lift for test files
gcode:
    {% set kind = params.KIND|default('')|upper %}
    {% if kind not in ['SQUARE', 'CIRCLE'] %}
        {action_raise_error('Specify KIND=SQUARE or KIND=CIRCLE')}
    {% endif %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        {action_raise_error('Home XYZ, then establish and check the work zero before starting this test')}
    {% endif %}
    {% set g = printer.gcode_move %}
    {% set t = printer.toolhead %}
    {% set bx = g.position.x - g.gcode_position.x %}
    {% set by = g.position.y - g.gcode_position.y %}
    {% set bz = g.position.z - g.gcode_position.z %}
    {% set lo = 5.0 if kind == 'SQUARE' else 25.0 %}
    {% set hi = 565.0 if kind == 'SQUARE' else 125.0 %}
    {% set zlo = -0.25 if kind == 'SQUARE' else 40.0 %}
    {% set zhi = 13.0 if kind == 'SQUARE' else 50.0 %}
    {% if lo + bx < t.axis_minimum.x or hi + bx > t.axis_maximum.x %}
        {action_raise_error('Test X envelope exceeds machine travel at this work zero; reposition the work origin')}
    {% endif %}
    {% if lo + by < t.axis_minimum.y or hi + by > t.axis_maximum.y %}
        {action_raise_error('Test Y envelope exceeds machine travel at this work zero; reposition the work origin')}
    {% endif %}
    {% if zlo + bz < t.axis_minimum.z or zhi + bz > t.axis_maximum.z %}
        {action_raise_error('Test Z range or 10 mm pause lift exceeds machine travel; check the tool surface zero')}
    {% endif %}
    {% if printer.pause_resume.is_paused %}
        {action_raise_error('Finish or cancel the previous paused job before starting a new test')}
    {% endif %}
    RESPOND TYPE=echo MSG="{kind} preflight passed: X short, Y long; work zero preserved."
