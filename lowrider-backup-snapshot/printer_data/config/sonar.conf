# Any configuration changes require a service restart to take effect.
# Persistent logging is enabled so connection-loss and recovery events
# remain available after a reboot. Routine successful pings are not logged.

[sonar]
enable: true
debug_log: false
persistent_log: true
target: auto
count: 3
interval: 60
restart_threshold: 10