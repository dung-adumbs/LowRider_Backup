# LowRider pen-lift servo on the SKR V1.4 dedicated SERVOS signal pin.
#
# Deliberately omit initial_angle / initial_pulse_width. Klipper therefore
# sends no servo signal after startup until the operator explicitly commands
# one. This prevents an uncalibrated linkage from moving during a restart.

[servo pen_lift]
pin: P2.0
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025

[gcode_macro _PEN_LIFT_SETTINGS]
description: Internal pen-lift calibration values; -1 means not calibrated
variable_up_angle: 10.0
variable_down_angle: 120.0
gcode:

[gcode_macro PEN_LIFT_ANGLE]
description: Calibration only - command a bounded pen servo angle (0 to 180 degrees)
gcode:
  {% if 'ANGLE' not in params %}
    { action_raise_error("PEN_LIFT_ANGLE requires ANGLE=0..180") }
  {% endif %}
  {% set angle = params.ANGLE|float %}
  {% if angle < 0.0 or angle > 180.0 %}
    { action_raise_error("Pen-lift angle must be between 0 and 180 degrees") }
  {% endif %}
  SET_SERVO SERVO=pen_lift ANGLE={angle}
  RESPOND TYPE=command MSG="Pen-lift calibration angle set to {angle|round(1)} degrees"

[gcode_macro PEN_LIFT_OFF]
description: Stop pen-lift PWM while retaining the servo's last mechanical position
gcode:
  SET_SERVO SERVO=pen_lift WIDTH=0
  RESPOND TYPE=command MSG="Pen-lift PWM disabled"

[gcode_macro PEN_UP]
description: Raise the pen after an up angle has been calibrated
gcode:
  {% set angle = printer['gcode_macro _PEN_LIFT_SETTINGS'].up_angle|float %}
  {% if angle < 0.0 %}
    { action_raise_error("Pen-up angle is not calibrated; use PEN_LIFT_ANGLE first") }
  {% endif %}
  SET_SERVO SERVO=pen_lift ANGLE={angle}

[gcode_macro PEN_DOWN]
description: Lower the pen after a down angle has been calibrated
gcode:
  {% set angle = printer['gcode_macro _PEN_LIFT_SETTINGS'].down_angle|float %}
  {% if angle < 0.0 %}
    { action_raise_error("Pen-down angle is not calibrated; use PEN_LIFT_ANGLE first") }
  {% endif %}
  SET_SERVO SERVO=pen_lift ANGLE={angle}
