# Motor-port diagnostic swap 2026-10-18: Y1 and Z1 cables exchanged on E0/E1.
# Endstop wiring and logical motor direction retained; step/dir/enable/UART follow ports.
# SKR V1.4 LPC1768 - axis layout 2026-10-18
# X: single motor, 0..624 mm, homes at 0; origin changed 2026-10-21.
# Y/Y1: dual motors, 0..1020 mm, homes at 0; physical travel unchanged.
# Y direction reversed relative to the previous logical X.
# Previous stock coordinates translate by X+12.5 / Y+10. Machine minimum corner is 0,0.
# Z/Z1: unchanged, homes MAX at 109 mm. Physical wiring unchanged.

[stepper_x]
step_pin: P2.2
dir_pin: !P2.6
enable_pin: !P2.1
microsteps: 32
rotation_distance: 32
endstop_pin: ^P1.29
position_endstop: 0
position_min: 0
position_max: 624
homing_speed: 35
homing_positive_dir: false

[stepper_y]
step_pin: P0.19
dir_pin: P0.20
enable_pin: !P2.8
microsteps: 32
rotation_distance: 32
endstop_pin: ^P1.28
position_endstop: 0
position_min: 0
position_max: 1020
homing_speed: 35
homing_positive_dir: false

[stepper_y1]
step_pin: P1.15
dir_pin: !P1.14
enable_pin: !P1.16
microsteps: 32
rotation_distance: 32
endstop_pin: ^P1.26

[stepper_z]
step_pin: P0.22
dir_pin: P2.11
enable_pin: !P0.21
microsteps: 32
rotation_distance: 8
endstop_pin: ^P1.27
position_endstop: 109
position_min: 0
position_max: 109
homing_speed: 8
homing_positive_dir: true

[stepper_z1]
step_pin: P2.13
dir_pin: P0.11
enable_pin: !P2.12
microsteps: 32
rotation_distance: 8
endstop_pin: ^P1.25

# All five TMC2209 modules are installed in UART mode, with their DIAG pins
# isolated from the physical endstop inputs.

[tmc2209 stepper_x]
uart_pin: P1.10
run_current: 0.900

[tmc2209 stepper_y]
uart_pin: P1.9
run_current: 0.900

[tmc2209 stepper_y1]
uart_pin: P1.1
run_current: 0.900

[tmc2209 stepper_z]
uart_pin: P1.8
run_current: 0.900

[tmc2209 stepper_z1]
uart_pin: P1.4
run_current: 0.900

